name: Mirror upstream

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-upstream
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out mirror script
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$SOURCE_REPOSITORY"
          git fetch --depth=1 --filter=blob:none --no-tags origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/.github/scripts/mirror-upstream.sh'
          git checkout --detach FETCH_HEAD

      - name: Require workflow-capable sync credential
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo 'Configure UPSTREAM_SYNC_TOKEN with Contents and Workflows write access for this repository.' >&2
            exit 1
          fi

      - name: Mirror upstream and rebase Local main
        id: mirror
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          DESTINATION_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          bash .github/scripts/mirror-upstream.sh https://github.com/pingdotgg/t3code.git "$DESTINATION_REPOSITORY"

      - name: Mirror summary
        env:
          UPSTREAM_SHA: ${{ steps.mirror.outputs.upstream_sha }}
          CHANGED: ${{ steps.mirror.outputs.changed }}
        run: |
          {
            echo '### Upstream mirror'
            echo "Revision: ${UPSTREAM_SHA}"
            echo "Changed: ${CHANGED}"
            echo 'upstream/main tracks exact upstream commits. Local main contains rebased Local commits above that revision.'
            echo 'Both branches update atomically with explicit leases. Conflicts leave both branches unchanged. Previous Local tips are retained under local-rebase tags.'
            echo 'This workflow does not start a macOS build or publish a release.'
          } >> "$GITHUB_STEP_SUMMARY"
